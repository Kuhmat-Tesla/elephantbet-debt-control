<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body>
    <nav class="navbar shadow">
      <div
        class="container-fluid d-flex justify-content-between align-items-center px-3"
      >
        <span class="menu-btn">
          <i class="bi bi-list"></i>
        </span>
        <img
          class="img-logo"
          src="{{ url_for('static', filename='images/logo.svg') }}"
        />
        <span class="search">
          <i class="bi bi-search"></i>
        </span>
      </div>
    </nav>
    {% block main %} {% endblock %}
    <footer>
      <div class="container nav-bottom shadow-lg">
        <div class="nav-bottom-item active" onclick="set_screen('home', this)">
          <i class="bi bi-house-fill"></i>
          <p>Home</p>
        </div>
        <div
          class="nav-bottom-item qr-code shadow"
          onclick="set_screen('create-dept', this)"
        >
          <i class="bi bi-qr-code-scan"></i>
        </div>
        <div
          class="nav-bottom-item"
          onclick="set_screen('customers-screen', this)"
        >
          <i class="bi bi-people-fill"></i>
          <p>Clientes</p>
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
